# Local SearXNG for the job assistant. Secret comes from SEARXNG_SECRET env (docker-compose.yml).
use_default_settings:
  engines:
    keep_only: [google, bing, duckduckgo, brave, startpage, mojeek, yahoo, qwant]
general:
  instance_name: "job-assistant-search"
server:
  limiter: false          # local, single user
  image_proxy: false
  method: "GET"
search:
  safe_search: 0
  formats: [html, json]
  ban_time_on_fail: 300
  max_ban_time_on_fail: 3600
outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: yahoo
    disabled: false
  - name: qwant
    disabled: false
