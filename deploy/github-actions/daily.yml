# Daily job agent run — copy this file to .github/workflows/daily.yml in your PRIVATE data repo
# (not in the public code repo). See docs/DAILY_CLOUD_RUN.md.
#
# Private repo layout:  data/ (jobs.db + cache)   resumes/*.pdf   .github/workflows/daily.yml   .gitignore
# Secrets (repo Settings → Secrets and variables → Actions): GEMINI_API_KEY, GMAIL_CREDENTIALS_JSON, GMAIL_TOKEN_JSON
# Optional variables: DAILY_EMAIL_LIMIT (default 30), DAILY_RUN_MINUTES (default 35)
name: Daily job agent

on:
  schedule:
    - cron: "30 2 * * *"          # 02:30 UTC = 08:00 IST (GitHub may start it a few minutes late)
  workflow_dispatch: {}            # "Run workflow" button (also in the GitHub mobile app)

concurrency:
  group: daily-job-agent
  cancel-in-progress: false

permissions:
  contents: write                  # commit the updated database back to this private repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kolkata             # same timezone as the laptop (daily limit counts "today" in IST)
    steps:
      - name: Check out private data repo
        uses: actions/checkout@v4

      - name: Check out the app code (public repo)
        uses: actions/checkout@v4
        with:
          repository: debasish218/Automatic_job_apply
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install
        run: pip install -q -r code/requirements.txt

      - name: Start SearXNG
        working-directory: code
        run: SEARXNG_SECRET="$(openssl rand -hex 24)" docker compose up -d searxng

      - name: Mark run in progress (laptop dashboard opens read-only meanwhile)
        run: |
          git config user.name "Debasish Mahapatra"
          git config user.email "debasishmahapatra218@gmail.com"
          mkdir -p data
          date -Iseconds > data/RUNNING
          git add data/RUNNING
          git commit -q -m "Daily run started"
          git push -q

      - name: Write Gmail login files (never printed)
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          umask 077
          mkdir -p code/credentials
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > code/credentials/credentials.json
          printf '%s' "$GMAIL_TOKEN_JSON" > code/credentials/token.json

      - name: Daily run (drafts go to Gmail Drafts; nothing is sent to recruiters)
        working-directory: code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_DIR: ${{ github.workspace }}/data
          RESUMES_DIR: ${{ github.workspace }}/resumes
          DAILY_EMAIL_LIMIT: ${{ vars.DAILY_EMAIL_LIMIT || '30' }}
          DAILY_RUN_MINUTES: ${{ vars.DAILY_RUN_MINUTES || '35' }}
        run: python run.py --daily

      - name: Save database to this repo
        if: always()
        run: |
          rm -f code/credentials/*.json data/RUNNING
          git add -A data
          git commit -q -m "Daily run $(date +%F)" || echo "no data changes"
          # if the laptop pushed meanwhile, keep this run's data on a rescue branch instead of losing it
          git push -q || git push -q origin "HEAD:refs/heads/rescue-${{ github.run_id }}"
